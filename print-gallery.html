<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Gallery</title>
    <link rel="icon" type="image/png" href="images/COGSPA.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --muted: #d9d9d9;
            --max-width: 1440px;
            --side-pad: clamp(16px, 2.5vw, 32px);
            --section-gap: clamp(48px, 8vw, 120px);
            --title-size: clamp(3rem, 8vw, 5rem);
            --h2-size: clamp(2rem, 5vw, 3.5rem);
            --h3-size: clamp(1.5rem, 4vw, 2.5rem);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Instrument Sans", sans-serif;
        }

        /* Fixed Nav Bar */
        .fixed-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid #000000;
            z-index: 1000;
            padding: 12px var(--side-pad);
        }

        .nav-container {
            width: min(100%, var(--max-width));
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 20px;
            justify-content: flex-start;
        }

        .nav-container a {
            color: #000000;
            text-decoration: none;
            font-size: clamp(0.75rem, 1.1vw, 0.95rem);
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
            transition: opacity 0.2s ease;
        }

        .nav-container a:hover {
            opacity: 0.5;
        }

        .nav-container a.active {
            text-decoration: underline;
            text-underline-offset: 4px;
            font-weight: 800;
        }

        .container {
            width: min(100%, var(--max-width));
            margin: 0 auto;
            padding: clamp(80px, 8vw, 100px) var(--side-pad) 80px;
        }

        .nav-link {
            display: inline-block;
            margin-bottom: 40px;
            color: inherit;
            text-decoration: none;
            font-size: 1.2rem;
            transition: opacity 0.2s ease;
        }

        .nav-link:hover {
            opacity: 0.6;
        }

        h1,
        .site-title {
            font-size: var(--title-size);
            font-weight: 400;
            margin: 0 0 40px 0;
            line-height: 1;
        }

        h2,
        .page-title {
            font-size: var(--h2-size);
            font-weight: 400;
            margin: var(--section-gap) 0 40px 0;
            line-height: 1.1;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            width: 100%;
            margin-bottom: 60px;
        }

        .gallery-item {
            width: 100%;
            background: var(--muted);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

            <a href="index.html#case-studies">CASE STUDIES</a>
            <a href="videography.html">VIDEOGRAPHY</a>

            <a href="https://monsterrig.blogspot.com/" target="_blank" rel="noopener noreferrer">ZBRUSH MODELS</a>
            <a href="https://jmicallefprofport.com/" target="_blank" rel="noopener noreferrer">EDUCATOR PORTFOLIO</a>
        </div>
    </nav>

    <div class="page">
        <main class="container">
            <a href="index.html" class="nav-link">&larr; Back to Home</a>

            <h1 class="site-title">
                JOE MICALLEF<br>

                <div class="gallery-item"><img src="port_art/A1.png" alt="Print 1"></div>
                <div class="gallery-item"><img src="port_art/A2.png" alt="Print 2"></div>
                <div class="gallery-item"><img src="port_art/A3.png" alt="Print 3"></div>

            </div>

        </main>
    </div>
</body>

</html>
