<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>v3</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden form to let Netlify crawler detect the form fields for SPA submissions -->
    <form name="custom-tool-requests" method="POST" data-netlify="true" netlify data-netlify-honeypot="bot-field" style="display: none">
      <input type="hidden" name="form-name" value="custom-tool-requests" />
      <input type="text" name="toolType" />
      <input type="text" name="integration" />
      <textarea name="notes"></textarea>
      <input type="text" name="name" />
      <input type="email" name="email" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
