<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Netlify Form Detection</title>
  </head>
  <body>
    <form name="custom-tool-requests" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" action="/__forms.html">
      <input type="hidden" name="form-name" value="custom-tool-requests" />
      <input type="text" name="bot-field" />
      <input type="text" name="toolType" />
      <input type="text" name="integration" />
      <textarea name="notes"></textarea>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
